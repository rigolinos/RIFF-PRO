<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1115" />
    <title>Riff Clubes — sem conexão</title>
    <!-- Tela mostrada pelo service worker quando não há internet. Sem script: a CSP só aceita o que é do próprio site. -->
    <style>
      :root { --bg: #0F1115; --surface: #171A20; --line: #2B313B; --ink: #F3EFE4; --ink-muted: #A3A9B5; --brand: #F2CE56; --brand-ink: #0F1115; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 32px;
             background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.5rem; line-height: 1.2; margin: 24px 0 8px; }
      p { color: var(--ink-muted); font-size: 0.9375rem; line-height: 1.55; margin: 0 0 24px; }
      a { display: block; padding: 14px 20px; border-radius: 14px; background: var(--brand); color: var(--brand-ink);
          font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/app-icon-192.png" alt="Riff Clubes" />
      <h1>Você está sem conexão</h1>
      <p>O Riff Clubes precisa de internet para mostrar a agenda da sua comunidade. Confira o Wi-Fi ou os dados do celular e tente de novo.</p>
      <a href="/">Tentar de novo</a>
    </main>
  </body>
</html>
