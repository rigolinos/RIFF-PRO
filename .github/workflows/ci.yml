name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Design System check
        run: npm run check:ds

      - name: Encoding check
        run: npm run check:encoding

      - name: Build and Typecheck
        run: npm run build

